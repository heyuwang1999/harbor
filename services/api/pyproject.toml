[project]
name = "harbor-api"
version = "0.1.0"
description = "Harbor API: bilingual RAG knowledge assistant backend"
authors = [
    { name = "heyuwang1999", email = "heyuwang.main@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opencc>=1.4.2",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.53",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
harbor-api = "harbor_api:main"
harbor-demo-seed = "harbor_api.demo.seed:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.0.1",
    "ruff>=0.16.7",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
# S101: assert is fine in tests. RUF00x: full-width CJK punctuation is expected.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Migrations build DDL from module constants (table names), never from user input.
"migrations/versions/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# reportlab ships no type stubs; it only builds a PDF fixture for the parser tests.
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
