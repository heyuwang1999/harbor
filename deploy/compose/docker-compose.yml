# Local stacks.
#   make infra   → databases + mock model only (for `make dev-api` / `make dev-web`)
#   make demo    → the whole demo, migrated and seeded, on http://localhost:3000
name: harbor

x-db-app: &db-app postgresql+asyncpg://harbor_app:harbor_app@postgres:5432/harbor
x-db-owner: &db-owner postgresql+psycopg://harbor:harbor@postgres:5432/harbor

services:
  postgres:
    # ParadeDB = Postgres 18 + pg_search (BM25, Jieba tokenizer) + pgvector. See docs/adr/0001.
    image: paradedb/paradedb:0.25.9-pg18
    # Parallel HNSW builds allocate dynamic shared memory; Docker's 64MB default fails (ADR-0001).
    shm_size: 1g
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.6-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  mock-llm:
    build: ../../tools/mock-llm
    ports: ["127.0.0.1:8100:8100"]

  # One-shot: schema + demo corpus. `make demo` runs it between infra and the API, because
  # `up --wait` treats a container that exits — even successfully — as a failure.
  seed:
    profiles: [seed]
    build: ../../services/api
    command: sh -c "alembic upgrade head && harbor-demo-seed"
    environment:
      HARBOR_MIGRATION_DATABASE_URL: *db-owner
      HARBOR_EMBEDDING_BASE_URL: http://mock-llm:8100/v1
      HARBOR_LOG_JSON: "false"
    depends_on:
      postgres: { condition: service_healthy }
      mock-llm: { condition: service_started }
    restart: "no"

  api:
    profiles: [app, demo]
    build: ../../services/api
    environment:
      HARBOR_ENV: dev
      HARBOR_DATABASE_URL: *db-app
      HARBOR_MIGRATION_DATABASE_URL: *db-owner
      HARBOR_REDIS_URL: redis://valkey:6379/0
      HARBOR_LLM_BASE_URL: http://mock-llm:8100/v1
      HARBOR_EMBEDDING_BASE_URL: http://mock-llm:8100/v1
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  web:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      # Browser-visible: the API is published on the host, not inside the compose network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HARBOR_API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
